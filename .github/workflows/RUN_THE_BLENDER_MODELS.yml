name: Build Deeping 3D assets

on:
  workflow_dispatch:
    inputs:
      commit_assets:
        description: Commit generated GLBs back to this branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Build all 45 GLB templates
        run: blender -b --python-exit-code 1 --python tools/blender/build_deeping_assets.py -- --output public/models

      - name: Validate output
        run: |
          count="$(find public/models -name '*.glb' -type f | wc -l)"
          echo "Generated ${count} of 45 GLB models"
          test "$count" -eq 45
          test -s public/models/gear/sword.glb
          test -s public/models/enemies/bat.glb
          test -s public/models/pets/quadruped.glb

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: deeping-models
          path: public/models
          if-no-files-found: error

      - name: Commit generated models
        if: ${{ inputs.commit_assets }}
        run: |
          git config user.name "deeping-asset-forge"
          git config user.email "actions@users.noreply.github.com"
          git add public/models
          git diff --cached --quiet || git commit -m "Build Deeping GLB model library"
          git push
